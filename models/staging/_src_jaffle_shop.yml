version: 2

sources:
  - name: jaffle_shop
    database: raw
    tables:
    - name: customers
      description: customers table that includes loyalty info
      columns:
        - name: id
          data_tests:
             - not_null
             - unique
            
        - name: first_name
        - name: last_name
    - name: orders
      config: 
        freshness:
          warn_after:
            count: 24
            period: day
          error_after:
            count: 25
            period: day
        loaded_at_field: _etl_loaded_at