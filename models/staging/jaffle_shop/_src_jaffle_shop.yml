sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres database
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after: 
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: Primary key for the customers data
            data_tests:
              - unique
              - not_null
        freshness: null
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary key for the orders data
            data_tests:
              - unique
              - not_null
