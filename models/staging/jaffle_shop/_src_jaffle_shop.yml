sources:
  - name: jaffle_shop
    description: "Source data for the jaffle_shop project"
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: "Raw customers data from jaffle_shop"
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null        
      - name: orders
        description: "Raw orders data from jaffle_shop"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
          loaded_at_field: (_etl_loaded_at::timestamp_tz)