sources:
  - name: jaffle_shop
    description: A replica of the postgres database
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: one record per customer
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null

      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at