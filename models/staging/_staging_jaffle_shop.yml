version: 2

models:
  - name: stg_jaffle_shop__customers
    description: ""
    columns:
      - name: customer_id
        data_type: number
        description: ""
        data_tests:
          - not_null
          - unique
          

      - name: first_name
        data_type: varchar
        description: ""

      - name: last_name
        data_type: varchar
        description: ""

  - name: stg_jaffle_shop__orders
    description: ""
    columns:
      - name: order_id
        data_type: number
        description: ""

      - name: customer_id
        data_type: number
        description: ""

      - name: order_date
        data_type: date
        description: ""

      - name: status
        data_type: varchar
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments: 
                values: ["completed","shipped","returned","placed","return_pending"]

      - name: _etl_loaded_at
        data_type: timestamp_ntz
        description: ""
